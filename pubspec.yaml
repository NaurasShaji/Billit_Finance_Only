name: billit_finance
description: Standalone Billit finance monitoring application.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  file_picker: ^8.0.6
  pdf: ^3.11.3
  share_plus: 10.0.1
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icon/billit_icon.png
  adaptive_icon_foreground: assets/icon/billit_icon.png
  adaptive_icon_background: "#e6f7f4"
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/billit_icon.png
    background_color: "#e6f7f4"
    theme_color: "#0f9f8f"
  windows:
    generate: false
  macos:
    generate: true
    image_path: assets/icon/billit_icon.png
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
