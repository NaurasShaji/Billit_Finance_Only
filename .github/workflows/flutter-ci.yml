name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d test ]; then flutter test; else echo 'No test directory; skipping tests.'; fi

      - name: Build Android release APK
        run: flutter build apk --release

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate SQLite WebAssembly and worker files
        run: dart run sqflite_common_ffi_web:setup

      - name: Build production web app
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: billit-finance-web
          path: build/web/
          if-no-files-found: error
